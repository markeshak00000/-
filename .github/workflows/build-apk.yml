name: Build Andalus APK Final Pro
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: |
          mkdir -p www
          cp index.html www/index.html
          cp app-icon.png www/ 2>/dev/null || true
          ls -la www
      - run: |
          if [! -d "android" ]; then npx cap add android; fi
      - run: npx cap copy android
      - run: |
          chmod +x android/gradlew
          cd android
         ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Andalus-Home-Store-v1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: الاندلس-للادوات-المنزلية-APK
          path: Andalus-Home-Store-v1.0.0.apk
